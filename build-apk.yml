name: Build Domen.uz Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        working-directory: ./android-app
        run: gradle assembleRelease --no-daemon

      - name: Copy APK as Domen.uz.apk
        run: cp android-app/app/build/outputs/apk/release/app-release.apk Domen.uz.apk

      - name: Upload Domen.uz.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Domen-uz-Android-APK
          path: Domen.uz.apk
