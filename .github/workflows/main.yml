name: Build Domen.uz APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Android Project
        run: |
          mkdir -p android-app/app/src/main/java/uz/domen/app
          mkdir -p android-app/app/src/main/assets
          if [ -f index.html ]; then cp index.html android-app/app/src/main/assets/index.html; fi
          cat << 'EOF' > android-app/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DomenUz"
          include ':app'
          EOF
          cat << 'EOF' > android-app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'uz.domen.app'
              compileSdk 34
              defaultConfig {
                  applicationId "uz.domen.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 24
                  versionName "2.4.0"
              }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Domen.uz" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > android-app/app/src/main/java/uz/domen/app/MainActivity.java
          package uz.domen.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.*;
          public class MainActivity extends Activity {
              private WebView wv;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#052624"));
                  wv = new WebView(this);
                  wv.setBackgroundColor(Color.parseColor("#052624"));
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  wv.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("https://t.me/") || u.startsWith("tg://")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl()));
                              return true;
                          }
                          return false;
                      }
                  });
                  setContentView(wv);
                  wv.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (wv != null && wv.canGoBack()) wv.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        working-directory: ./android-app
        run: gradle assembleRelease --no-daemon

      - name: Upload Domen.uz.apk
        uses: actions/upload-artifact@v4
        with:
          name: Domen.uz-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
